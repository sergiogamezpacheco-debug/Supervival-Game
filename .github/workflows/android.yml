name: APK Android

# Cada push a main: tests -> compila el APK -> lo publica en "Releases".
# Desde el móvil: abre github.com/sergiogamezpacheco-debug/Supervival-Game/releases/latest
# y descarga Supervival.apk.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Caché de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Descargar Godot y plantillas de Android
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz 'templates/android_*' 'templates/version.txt' && rm templates.tpz
          ls -la templates

      - name: Instalar Godot
        run: |
          set -e
          sudo ln -sf ~/godot/godot /usr/local/bin/godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          cp ~/godot/templates/* "$tdir/"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.4.tres
          cat ~/.config/godot/editor_settings-4.4.tres
          godot --headless --version

      - name: Importar proyecto
        run: godot --headless --import

      - name: Tests
        run: godot --headless res://tests/test_runner.tscn

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/testing.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: supervival
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: supervival
        run: |
          set -e
          code=${{ github.run_number }}
          sed -i "s/^version\/code=.*/version\/code=${code}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${code}\"/" export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"0.1.${code}\"/" project.godot
          mkdir -p build
          godot --headless --export-release "Android" build/Supervival.apk 2>&1 | tee export.log
          test -s build/Supervival.apk || { echo "No se generó el APK"; exit 1; }
          ls -la build

      - name: Publicar en Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          msg="$(git log -1 --pretty=%s)"
          gh release create "$tag" build/Supervival.apk \
            --title "Supervival 0.1.${{ github.run_number }}" \
            --notes "Compilación automática de: ${msg}" \
            --latest

      # Ahorro de espacio: solo se guardan los 3 últimos APK en Releases (con sus etiquetas)
      # y se borra cualquier artefacto de ejecuciones antiguas.
      - name: Borrar APK y artefactos antiguos
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=3
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq 'sort_by(.created_at) | reverse | .[].tag_name' | tail -n +$((keep + 1)) |
          while read -r tag; do
            echo "Borrando $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate --jq '.artifacts[].id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
